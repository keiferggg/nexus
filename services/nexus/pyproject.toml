[project]
name = "nexus-service"
version = "0.1.0"
description = "NEXUS local orchestration service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "agent-framework-core==1.22.0",
  "agent-framework-orchestrations==1.3.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "keyring>=25,<26",
  "mcp==2.3.0",
  "pypdf==6.19.0",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyinstaller>=6.10"]

[project.scripts]
nexus-service = "nexus.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.setuptools.package-data]
nexus = ["persistence/migrations/*.sql"]
